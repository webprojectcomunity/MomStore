<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog & Pemesanan Makanan</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #333; margin-bottom: 20px; }
    
    /* Utility Class untuk Kontrol Halaman */
    .page { display: none; }
    .page.active { display: block; }

    /* Loading State */
    #loading { text-align: center; font-weight: bold; color: #666; padding: 20px; }

    /* Grid Produk */
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .product-card { border: 1px solid #ddd; border-radius: 8px; overflow: hidden; padding: 12px; text-align: center; cursor: pointer; transition: 0.2s; background: #fafafa; display: flex; flex-direction: column; justify-content: space-between; }
    .product-card:hover { border-color: #25D366; transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .product-card img { width: 100%; height: 160px; object-fit: cover; border-radius: 5px; background: #eee; }
    .product-title { font-weight: bold; margin: 10px 0 5px; color: #2c3e50; font-size: 15px; }
    .product-price { color: #e74c3c; font-weight: bold; margin-bottom: 5px; font-size: 16px; }
    .product-desc { font-size: 12px; color: #666; height: 36px; overflow: hidden; margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .btn-select { background-color: #25D366; color: white; border: none; padding: 8px 12px; border-radius: 5px; font-weight: bold; cursor: pointer; }
    .btn-select:hover { background-color: #1ebc57; }

    /* Detail Produk Terpilih di Halaman Form */
    .selected-product-box { display: flex; align-items: center; gap: 15px; border: 1px solid #25D366; background: #e8f8ef; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    .selected-product-box img { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; }
    .selected-product-info h3 { margin: 0 0 5px 0; color: #2c3e50; font-size: 16px; }
    .selected-product-info .price { color: #e74c3c; font-weight: bold; font-size: 15px; }
    .selected-product-info .id-tag { font-size: 12px; color: #777; margin-top: 3px; }

    /* Form & Button */
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
    
    .btn-wa { width: 100%; background-color: #25D366; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-bottom: 10px; }
    .btn-wa:hover { background-color: #1ebc57; }
    
    .btn-back { width: 100%; background-color: #7f8c8d; color: white; border: none; padding: 10px; font-size: 14px; border-radius: 5px; cursor: pointer; }
    .btn-back:hover { background-color: #6c757d; }
  </style>
</head>
<body>

<div class="container">

  <!-- ================= HALAMAN 1: KATALOG MENU ================= -->
  <div id="page-katalog" class="page active">
    <h2>Katalog Menu Makanan</h2>
    <div id="loading">Memuat produk dari Google Sheet...</div>
    <div id="productGrid" class="product-grid"></div>
  </div>

  <!-- ================= HALAMAN 2: FORM PEMESANAN ================= -->
  <div id="page-pemesanan" class="page">
    <h2>Form Pemesanan</h2>
    
    <!-- Ringkasan Produk Yang Dipilih -->
    <div id="selectedProductBox" class="selected-product-box"></div>

    <form id="orderForm">
      <div class="form-group">
        <label for="jumlah">Jumlah / Qty:</label>
        <input type="number" id="jumlah" min="1" value="1" required>
      </div>

      <div class="form-group">
        <label for="nama">Nama Lengkap:</label>
        <input type="text" id="nama" placeholder="Masukkan nama Anda" required>
      </div>

      <div class="form-group">
        <label for="alamat">Alamat Lengkap Pengiriman:</label>
        <textarea id="alamat" rows="3" placeholder="Jalan, No. Rumah, Kecamatan, Kota" required></textarea>
      </div>

      <div class="form-group">
        <label for="catatan">Catatan Tambahan (Opsional):</label>
        <input type="text" id="catatan" placeholder="Contoh: Pedas sedang / Titip di satpam">
      </div>

      <button type="button" class="btn-wa" onclick="kirimKeWA()">Pesan via WhatsApp</button>
      <button type="button" class="btn-back" onclick="bukaKatalog()">← Kembali Pilih Menu Lain</button>
    </form>
  </div>

</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzMaKB9zAWbxHQnOwUJdhACpgaJyF38_hzN8UUhM0jUrvtyQThvBmYF05ZlqH8lbmd1/exec";
  const ADMIN_WA = "6282174407973";

  let productsDataStore = {}; // Menampung data produk berdasarkan id_produk
  let currentSelectedProduct = null;

  // Helper memformat harga Rupiah
  function formatRupiah(rawHarga) {
    if (!rawHarga) return "Rp 0";
    let cleanNumber = String(rawHarga).replace(/[^0-9]/g, '');
    if (!cleanNumber) return String(rawHarga);
    return "Rp " + Number(cleanNumber).toLocaleString('id-ID');
  }

  // Load Produk dari Apps Script / Spreadsheet
  async function loadProducts() {
    const loadingEl = document.getElementById("loading");
    const gridEl = document.getElementById("productGrid");

    try {
      const response = await fetch(`${SCRIPT_URL}?action=getProducts`);
      const result = await response.json();
      loadingEl.style.display = "none";

      let productsList = [];
      if (result.success && result.data && result.data.length > 0) {
        productsList = result.data;
      } else {
        // Fallback data langsung dari spreadsheet jika action=getProducts kosong
        productsList = [
          { id_produk: "PRD-0001", nama: "Ayam geprek Cabe hijau", deskripsi: "Nikmati kelezatan otentik Ayam Penyet kami! Diracik dengan bumbu rempah pilihan.", harga: "Rp.20.000", gambar: "https://drive.google.com/thumbnail?id=18MssuYdM7HxTOQbx2x2IQ-UFr71dZ1zs&sz=w1000" },
          { id_produk: "PRD-0002", nama: "Mie goreng", deskripsi: "Nikmati kelezatan Mie Goreng Nusantara dengan perpaduan bumbu rempah otentik.", harga: "Rp.20.000", gambar: "https://drive.google.com/thumbnail?id=1coFeNL205zumr4P_jjwEUGGNllDAdfxY&sz=w1000" },
          { id_produk: "PRD-0003", nama: "Ayam Bakar", deskripsi: "Ayam Bakar: Bumbu Meresap, Sambalnya Bikin Mantap! Daging Empuk.", harga: "Rp.25.000", gambar: "https://drive.google.com/thumbnail?id=1ixmPLoJw7QJvZc3Qv-4IFvx8trH_MAIK&sz=w1000" },
          { id_produk: "PRD-0004", nama: "Kuetiau", deskripsi: "Rasakan sensasi kelezatan Kwetiau Goreng dengan bumbu rempah rahasia.", harga: "Rp.20.000", gambar: "https://drive.google.com/thumbnail?id=1oMy9xtaacYDMosp4eumSX6A6pxVvHTfL&sz=w1000" },
          { id_produk: "PRD-0005", nama: "Berger ayam Plus Telur", deskripsi: "Roti lembut berpadu dengan daging juicy dan saus lumer di mulut.", harga: "Rp.23.000", gambar: "https://drive.google.com/thumbnail?id=1FPv-co9s6VzaywNjf2fykEfvsDZ25Apg&sz=w1000" },
          { id_produk: "PRD-0006", nama: "Tela Tela", deskripsi: "Cemilan kriuk dan gurih! Tela-Tela Crispy luar garing dalam lembut.", harga: "Rp.10.000", gambar: "https://drive.google.com/thumbnail?id=16WMKweLk3NjjJTlPl2ypl62ROZk5kNS-&sz=w1000" },
          { id_produk: "PRD-0007", nama: "Mie Ayam", deskripsi: "Mie Ayam Spesial. Mienya kenyal, topping ayam melimpah.", harga: "Rp.20.000", gambar: "https://drive.google.com/thumbnail?id=1mUETurddyu7-Zq43wStjGq8655Dmcjwg&sz=w1000" },
          { id_produk: "PRD-0008", nama: "Nasi Goreng Kampung", deskripsi: "Gurihnya kaldu dipadu pedas cabai hijau/merah bikin semangat balik lagi.", harga: "Rp.22.000", gambar: "https://drive.google.com/thumbnail?id=17GOg5i2HMTrnpDAT7vrG3xjOEiXRxKWU&sz=w1000" },
          { id_produk: "PRD-0009", nama: "Mie Rebus", deskripsi: "Nasi Mie Rebus porsi mantap, kuah medok, rasa juara.", harga: "Rp.20.000", gambar: "https://drive.google.com/thumbnail?id=13G0_mz-cIUP-LfGXl7n42k4FisNx2nEb&sz=w1000" },
          { id_produk: "PRD-0010", nama: "Lontong Sayur", deskripsi: "Kuah santan kental, gurih, dan berasa bumbu rempah Asli.", harga: "Rp.15.000", gambar: "https://drive.google.com/thumbnail?id=1-WJMUHXigUWC6w8Zs9YjGUrjxfYnD3qM&sz=w1000" },
          { id_produk: "PRD-0011", nama: "Gado-gado", deskripsi: "Sayuran segar dipadu bumbu kacang gurih, kental, dan legit.", harga: "Rp.20.000", gambar: "https://drive.google.com/thumbnail?id=1wDuPWmUkG0gri6D3T9WXW5MQAf3bJQsS&sz=w1000" },
          { id_produk: "PRD-0012", nama: "Dimsum", deskripsi: "Dimsum ayam udang siap manjain lidahmu hari ini. Dibuat dari daging pilihan.", harga: "Rp.25.000", gambar: "https://drive.google.com/thumbnail?id=1ZKQzCwEU1uxWrUFV1krXbvtO9bEbfpyM&sz=w1000" }
        ];
      }

      gridEl.innerHTML = "";
      productsList.forEach(item => {
        // Simpan data produk ke objek penyimpan berdasarkan id_produk
        productsDataStore[item.id_produk] = item;

        const formattedPrice = formatRupiah(item.harga);
        const card = document.createElement("div");
        card.className = "product-card";
        card.onclick = () => pilihProduk(item.id_produk);

        card.innerHTML = `
          <img src="${item.gambar || 'https://via.placeholder.com/150'}" alt="${item.nama}" onerror="this.src='https://via.placeholder.com/150'">
          <div class="product-title">${item.nama}</div>
          <div class="product-price">${formattedPrice}</div>
          <div class="product-desc">${item.deskripsi || ''}</div>
          <button class="btn-select">Pesan Sekarang</button>
        `;
        gridEl.appendChild(card);
      });

    } catch (error) {
      console.error(error);
      loadingEl.innerText = "Gagal memuat data produk.";
    }
  }

  // LOGIKA PEMINDAHAN HALAMAN & PENANGANAN id_produk
  function pilihProduk(idProduk) {
    const item = productsDataStore[idProduk];
    if (!item) return;

    currentSelectedProduct = item;

    // Render info produk terpilih di halaman form
    const formattedPrice = formatRupiah(item.harga);
    const boxEl = document.getElementById("selectedProductBox");
    boxEl.innerHTML = `
      <img src="${item.gambar || 'https://via.placeholder.com/150'}" alt="${item.nama}" onerror="this.src='https://via.placeholder.com/150'">
      <div class="selected-product-info">
        <h3>${item.nama}</h3>
        <div class="price">${formattedPrice}</div>
        <div class="id-tag">Kode Produk: <strong>${item.id_produk}</strong></div>
      </div>
    `;

    // Tampilkan Halaman Form Pemesanan & Sembunyikan Halaman Katalog
    document.getElementById("page-katalog").classList.remove("active");
    document.getElementById("page-pemesanan").classList.add("active");

    // Scroll ke paling atas halaman
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function bukaKatalog() {
    // Sembunyikan Form Pemesanan & Tampilkan Katalog Menu
    document.getElementById("page-pemesanan").classList.remove("active");
    document.getElementById("page-katalog").classList.add("active");
  }

  // KIRIM PESANAN KE WHATSAPP
  function kirimKeWA() {
    const nama = document.getElementById("nama").value.trim();
    const jumlah = document.getElementById("jumlah").value;
    const alamat = document.getElementById("alamat").value.trim();
    const catatan = document.getElementById("catatan").value.trim() || "-";

    if (!currentSelectedProduct) {
      alert("Produk tidak ditemukan! Silakan pilih kembali dari katalog.");
      bukaKatalog();
      return;
    }
    if (!nama || !alamat) {
      alert("Silakan lengkapi nama dan alamat pengiriman Anda!");
      return;
    }

    const formattedPrice = formatRupiah(currentSelectedProduct.harga);

    let pesan = `Halo Admin, saya ingin memesan produk berikut:\n\n`;
    pesan += `*ID Produk:* ${currentSelectedProduct.id_produk}\n`;
    pesan += `*Produk:* ${currentSelectedProduct.nama}\n`;
    pesan += `*Harga Satuan:* ${formattedPrice}\n`;
    pesan += `*Jumlah:* ${jumlah}\n\n`;
    pesan += `*Data Pemesan:*\n`;
    pesan += `• *Nama:* ${nama}\n`;
    pesan += `• *Alamat:* ${alamat}\n`;
    pesan += `• *Catatan:* ${catatan}\n\n`;
    pesan += `Mohon diinfokan total pembayaran dan nomor rekeningnya. Terima kasih!`;

    const urlWA = `https://wa.me/${ADMIN_WA}?text=${encodeURIComponent(pesan)}`;
    window.open(urlWA, '_blank');
  }

  window.onload = loadProducts;
</script>

</body>
</html>
